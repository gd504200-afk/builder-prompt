<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>레이더 이미지 프롬프트 빌더</title>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#edf5ff;background:#07111d;line-height:1.6}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 78% 0%,#173c58,transparent 50%);min-height:100vh}
main{width:min(1160px,calc(100% - 40px));margin:auto;padding:64px 0 48px}
header{margin-bottom:32px}
h1,h2,p{margin:0}
h1{font-size:clamp(28px,5vw,48px);line-height:1.2;letter-spacing:-.06em}
h2{font-size:20px;letter-spacing:-.03em}
p,small{color:#becddd}
header p{margin-top:12px}
.layout{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr);gap:20px}
section,details{border:1px solid #294258;background:#0d1b2a;border-radius:18px;padding:24px}
label{display:block;margin:20px 0 6px;font-weight:700}
select,textarea,button{font:inherit}
select,textarea{width:100%;border:1px solid #3b5369;border-radius:10px;background:#091522;color:inherit;padding:11px}
select{text-overflow:ellipsis}
small{display:block;margin-top:7px;min-height:2.7em}
textarea{margin-top:14px;display:block;min-height:430px;resize:vertical;font-size:14px;line-height:1.7}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
button{border:1px solid #3b5369;border-radius:9px;background:#162a3c;color:inherit;padding:8px 14px;cursor:pointer}
button:hover{filter:brightness(1.25)}
.primary{background:#8ce4f9;color:#082335;border-color:#8ce4f9;font-weight:750}
:focus-visible{outline:2px solid #8ce4f9;outline-offset:3px}
#status{min-height:1.6em;margin-top:8px;font-size:14px}
details{margin-top:20px}
summary{cursor:pointer;font-weight:700}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:#d4e2ee}
@media(max-width:780px){main{padding-top:36px}.layout{grid-template-columns:1fr}section,details{padding:18px}}
</style>
</head>
<body>
<main>
<header>
<h1>레이더 이미지 프롬프트 빌더</h1>
<p>지형, 시간대, 장비 연출을 골라 이미지 생성용 프롬프트를 만드세요.</p>
</header>
<div class="layout">
<section aria-labelledby="options-heading">
<h2 id="options-heading">장면 옵션</h2>
<label for="terrain">지형</label>
<select id="terrain" aria-describedby="terrain-detail"></select>
<small id="terrain-detail"></small>
<label for="lighting">시간대·조명</label>
<select id="lighting" aria-describedby="lighting-detail"></select>
<small id="lighting-detail"></small>
<label for="focus">강조할 장비·연출</label>
<select id="focus" aria-describedby="focus-detail"></select>
<small id="focus-detail"></small>
<div class="actions">
<button type="button" id="random">무작위 조합</button>
<button type="button" id="reset">기본값 복원</button>
</div>
</section>
<section aria-labelledby="prompt-heading">
<h2 id="prompt-heading">완성 프롬프트</h2>
<textarea id="prompt" aria-labelledby="prompt-heading" readonly spellcheck="false"></textarea>
<div class="actions">
<button type="button" class="primary" id="copy">프롬프트 복사</button>
<button type="button" id="download">TXT 저장</button>
</div>
<p id="status" role="status"></p>
</section>
</div>
<details><summary>옵션 원본 마크다운 보기</summary><pre id="source-view"></pre></details>
</main>
<script type="text/markdown" id="source"># 레이더 방공 시스템 이미지 프롬프트 옵션

기존 프롬프트의 **[변경값]**에 넣을 지형, 시간대·조명, 강조 장비 옵션을 각각 20개씩 정리했습니다. 각 열에서 하나씩 골라 조합하면 됩니다. 같은 행에 있는 옵션끼리 고를 필요는 없습니다.

| 번호 | 지형 | 시간대·조명 | 강조할 장비·연출 |
|---|---|---|---|
| 01 | 바위와 마른 풀이 섞인 산악 고원 | 일출 직전의 차가운 푸른빛 | **레이더** · 평판 안테나를 하늘에 대비되는 큰 실루엣으로 표현 |
| 02 | 붉은 사암층이 드러난 사막 협곡 | 해가 막 떠오르며 암석 가장자리를 비추는 시각 | **레이더** · 낮은 카메라 높이에서 차량과 안테나의 높이를 강조 |
| 03 | 눈 덮인 능선과 검은 암반이 만나는 고지대 | 이른 아침의 부드러운 사선광 | **레이더** · 차체와 평판 안테나가 함께 보이는 45도 구도 |
| 04 | 검은 현무암과 굳은 용암이 펼쳐진 평원 | 아침 안개 사이로 햇빛이 비치는 시각 | **레이더** · 안테나 테두리에 얇은 빛을 넣어 외곽선을 강조 |
| 05 | 녹색 초원과 완만한 언덕이 이어지는 평야 | 오전 햇빛이 금속 표면을 선명하게 비추는 시각 | **레이더** · 차체에 쌓인 먼지와 무광 금속 질감을 강조 |
| 06 | 바다를 내려다보는 암석 해안 절벽 | 얇은 구름이 햇빛을 고르게 퍼뜨리는 정오 | **레이더** · 주변 여백을 넉넉히 두어 평판 안테나의 형태를 선명하게 표현 |
| 07 | 잔물결과 소금 결정이 드러난 평탄한 소금 사막 | 한낮의 선명한 빛과 짧은 그림자 | **레이더** · 차체 옆면과 안테나에 닿는 빛으로 장비의 입체감을 강조 |
| 08 | 소나무 숲이 둘러싼 자갈 공터 | 오후 햇살이 구름 사이로 드는 시각 | **지휘통제소** · 열린 입구를 통해 내부 화면의 은은한 푸른빛을 보여줌 |
| 09 | 빙하가 깎아 만든 자갈과 암석의 넓은 계곡 | 늦은 오후의 따뜻한 빛과 긴 그림자 | **지휘통제소** · 천막의 주름과 고정 로프가 보이도록 외관을 표현 |
| 10 | 황토색 지층과 건조한 골짜기가 이어지는 구릉 | 골든아워의 낮고 따뜻한 측면광 | **지휘통제소** · 입구의 따뜻한 조명과 차가운 우주 하늘을 대비 |
| 11 | 비가 갠 뒤 얕은 물웅덩이가 남은 자갈 평원 | 해가 지평선에 닿는 주황빛 일몰 | **지휘통제소** · 천막과 입구 조명을 물웅덩이에 은은하게 반사 |
| 12 | 노란 풀과 회색 바위가 섞인 고산 초지 | 일몰 직후 보랏빛이 남은 하늘 | **지휘통제소** · 지붕 윤곽과 열린 입구가 모두 보이는 정면 구도 |
| 13 | 붉은 단풍 숲 너머로 능선이 겹쳐 보이는 고원 | 해가 진 뒤 지평선에 붉은 잔광이 남은 시각 | **지휘통제소** · 전경의 장비 상자와 천막을 함께 담아 현장감을 강조 |
| 14 | 하얀 석회암 절벽과 돌밭이 펼쳐진 대지 | 푸른 대기층과 첫 별이 함께 보이는 블루아워 | **지휘통제소** · 한쪽 측면까지 보이는 구도로 천막의 부피감과 직물 질감을 표현 |
| 15 | 안개가 낮게 깔린 습지 가장자리의 마른 둔덕 | 별이 또렷하고 지면에 달빛이 희미하게 닿는 초저녁 | **통신 중계소** · 안테나 타워에 달빛을 비춰 가느다란 구조를 강조 |
| 16 | 강줄기가 굽이치는 협곡 위의 평탄한 바위 지대 | 보름달의 밝은 빛이 암반을 비추는 밤 | **통신 중계소** · 수직 안테나와 낮은 차량의 높이 차를 강조 |
| 17 | 바람에 모래결이 선명하게 남은 사구 가장자리 | 초승달 아래 대기층의 푸른 띠가 도드라지는 밤 | **통신 중계소** · 별하늘을 배경으로 타워와 지지선의 실루엣을 표현 |
| 18 | 잔잔한 호수와 낮은 언덕이 보이는 호숫가 | 달이 뜨기 전 별빛과 지평선의 대기광만 남은 시각 | **통신 중계소** · 안테나 타워의 반영을 호수 표면에 은은하게 표현 |
| 19 | 큰 바위와 이끼가 섞인 차가운 툰드라 평원 | 옅은 오로라와 차가운 달빛이 겹치는 밤 | **통신 중계소** · 안테나 표면의 서리와 금속 질감을 가까운 시점에서 강조 |
| 20 | 계단식 암반이 펼쳐진 넓은 산기슭 | 새벽 동틀 무렵 지평선부터 푸르게 밝아오는 시각 | **통신 중계소** · 구름층 위로 솟은 타워 상단을 푸른 대기광에 대비 |

예를 들어 **지형 11번 + 시간대 14번 + 강조 장비 11번**을 고르면 아래처럼 바로 붙여 넣을 수 있습니다.

```text
[변경값]
- 지형: 비가 갠 뒤 얕은 물웅덩이가 남은 자갈 평원
- 시간대: 푸른 대기층과 첫 별이 함께 보이는 블루아워
- 강조할 장비: 중앙의 지휘통제소. 천막과 입구 조명이 물웅덩이에 은은하게 반사되도록 표현한다.
```

시리즈의 통일감을 유지하려면 **좌측 상단 기업명과 로고, 장비의 좌·중·우 순서, 하단 한글 라벨**을 고정하세요. 강조 장비를 바꿀 때는 해당 장비의 조명, 시점, 질감을 조정하면서 세 장비가 모두 화면에 들어오도록 하면 됩니다.
</script>
<script>
"use strict";
const source = document.getElementById("source").textContent.trim();
const rows = source.split(/\r?\n/)
  .filter(line => /^\| \d{2} \|/.test(line))
  .map(line => line.split("|").slice(1, -1).map(cell => cell.trim().replace(/\*\*/g, "")));
const fields = ["terrain", "lighting", "focus"];
const selects = fields.map(id => document.getElementById(id));
const prompt = document.getElementById("prompt");
const status = document.getElementById("status");
document.getElementById("source-view").textContent = source;

selects.forEach((select, column) => {
  rows.forEach((row, index) => {
    select.add(new Option(row[0] + " · " + row[column + 1], String(index)));
  });
  select.addEventListener("change", update);
});

function update() {
  const [terrain, lighting, focus] = selects.map((select, column) => {
    const value = rows[Number(select.value)][column + 1];
    document.getElementById(fields[column] + "-detail").textContent = value;
    return value;
  });
  prompt.value = `레이더 방공 시스템을 소개하는 16:9 가로형 한국어 콘셉트 인포그래픽 한 장을 생성한다. 실제 현장을 촬영한 듯한 장비와 지형에 지구의 대기권과 별이 보이는 우주 하늘을 결합한다. 참고 이미지가 첨부되면 장비 배치, 지평선의 곡률, 색감과 라벨 디자인을 참고한다.

[변경값]
- 지형: ${terrain}
- 시간대·조명: ${lighting}
- 강조할 장비·연출: ${focus}

[구도와 장비]
- 좌측 상단에 주황색 고리 세 개가 겹친 한화 로고 심벌과 흰색 기업명 “환화시스템”을 나란히 배치한다. 첫 글자 “환”을 그대로 쓴다. 공식 로고 파일이 첨부되면 그 파일을 사용한다.
- 우측 상단에는 “콘셉트 이미지”를 작고 선명하게 표시한다.
- 왼쪽에 평판 안테나를 얹은 레이더 차량, 중앙에 내부 화면이 살짝 보이는 지휘통제소, 오른쪽에 수직 안테나와 소형 차량이 있는 통신 중계소를 배치한다. 세 장비가 모두 보이도록 실루엣을 분리한다.
- 전경에는 선택한 지구 지형의 질감을 살린다. 배경에는 완만하게 휘어진 지구 지평선과 얇은 푸른 대기층, 짙은 남색 별하늘이 이어진다. 빛의 방향, 그림자와 원근은 일관되게 표현한다.

[하단 라벨에 들어갈 정확한 문구]
왼쪽
다기능 레이더
공중 물체를 탐지하고 추적합니다.

중앙
지휘통제소
탐지 정보를 모아 상황을 표시합니다.

오른쪽
통신 중계소
장비 간 정보를 전달합니다.

[타이포그래피와 마감]
하단에 반투명 짙은 남색 라벨 세 개를 가로로 정렬한다. 굵은 흰색 장비명 아래에 설명을 한 줄로 넣고, 가는 연결선으로 각 라벨과 해당 장비를 연결한다. 지정된 한글 문구를 그대로 쓰고 임의의 영문, 숫자, 표식을 추가하지 않는다.

금속 표면, 차체의 먼지와 천막의 주름은 사진처럼 표현한다. 미래적인 느낌은 푸른 대기광과 라벨의 얇은 청록색 테두리로 더한다. 발사 장면, 폭발, 조준선과 과도한 네온 효과는 제외한다. 장비 식별과 한글 가독성을 우선한다.`;
  status.textContent = "";
}

function reset() {
  selects.forEach((select, index) => { select.selectedIndex = [0, 8, 0][index]; });
  update();
}

document.getElementById("reset").addEventListener("click", reset);
document.getElementById("random").addEventListener("click", () => {
  selects.forEach(select => {
    const offset = 1 + Math.floor(Math.random() * (rows.length - 1));
    select.selectedIndex = (select.selectedIndex + offset) % rows.length;
  });
  update();
});
document.getElementById("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(prompt.value);
    status.textContent = "프롬프트를 복사했습니다.";
  } catch {
    prompt.focus();
    prompt.select();
    const copied = document.execCommand("copy");
    status.textContent = copied ? "프롬프트를 복사했습니다." : "선택한 텍스트를 Ctrl+C로 복사하세요.";
  }
});
document.getElementById("download").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([prompt.value], {type:"text/plain;charset=utf-8"}));
  const link = document.createElement("a");
  link.href = url;
  link.download = "radar-image-prompt.txt";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  status.textContent = "TXT 다운로드를 시작했습니다.";
});
reset();
</script>
</body>
</html>
